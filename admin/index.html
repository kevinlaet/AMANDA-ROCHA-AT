<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel da Amanda</title>
<meta name="theme-color" content="#0B5F59">
<link rel="icon" href="../img/logo.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Great Vibes';src:url(../fonts/greatvibes-sub.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Montserrat';src:url(../fonts/montserrat-sub.woff2) format('woff2');font-weight:400 800;font-display:swap}
:root{--teal:#0B5F59;--teal-d:#053F3A;--peach:#F5C59D;--peach-l:#FBE3CE;--cream:#FFF8F1;--sand:#F7EBDF;--ink:#16302C;--muted:#55706B;--line:#E7D6C6;--ok:#1B8A4B;--warn:#B5651D;--bad:#B3392F;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;font-size:16px;line-height:1.5;color:var(--ink);background:var(--cream);min-height:100vh;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 60px}
header{background:var(--teal);color:var(--cream);padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:34px;color:var(--peach);line-height:1}
header small{display:block;font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--peach-l)}
.sair{background:transparent;border:1.5px solid rgba(245,197,157,.6);color:var(--peach-l);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600}
h2{font-size:18px;font-weight:800;color:var(--teal);margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.badge{background:var(--warn);color:#fff;font-size:13px;font-weight:800;border-radius:99px;padding:2px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.msg{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:#fdecea;color:var(--bad);font-weight:600;font-size:15px}
.msg.ok{background:#e6f4ec;color:var(--ok)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input[type=email],input[type=password],input[type=date]{width:100%;min-height:52px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none}
input:focus{border-color:var(--teal)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;border:2px solid transparent;font-weight:700;width:100%}
.btn.main{background:var(--teal);color:var(--cream);margin-top:16px}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink)}
.btn.bad{border-color:var(--bad);color:var(--bad);background:#fff}
.btn:disabled{opacity:.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:68px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700}
.chip[aria-pressed=true]{background:#E9F4F1;border-color:var(--teal);color:var(--teal-d)}
.pedido{border-left:6px solid var(--warn)}
.pedido b{font-size:18px}
.pedido .qd{color:var(--muted);font-size:15px;margin:2px 0 4px}
.dia{margin-top:14px}
.dia h3{font-size:15px;font-weight:800;margin-bottom:8px}
.s{min-height:48px;min-width:76px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;text-align:center;line-height:1.2}
.s small{display:block;font-weight:600;font-size:11px;letter-spacing:.5px}
.s.livre{border-color:#BFD9D4;background:#EEF7F5;color:var(--teal-d)}
.s.pedido{border-color:var(--warn);background:#FFF3E5;color:var(--warn)}
.s.confirmado{border-color:var(--ok);background:#E6F4EC;color:var(--ok)}
.s[aria-pressed=true]{outline:3px solid var(--teal);outline-offset:1px}
.acoes{margin-top:12px;padding:14px;border-radius:14px;background:var(--sand);display:grid;gap:10px}
.acoes p{font-weight:700}
.vazio{color:var(--muted);padding:6px 2px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
[hidden]{display:none!important}
</style>
</head>
<body>

<section id="vLogin" hidden>
  <header><div><h1>Amanda Rocha</h1><small>Painel da agenda</small></div></header>
  <div class="wrap">
    <h2>Entrar</h2>
    <form class="card" id="fLogin">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>
      <button class="btn main" type="submit" id="bLogin">Entrar</button>
      <div class="msg" id="mLogin" hidden></div>
    </form>
  </div>
</section>

<section id="vApp" hidden>
  <header><div><h1>Amanda Rocha</h1><small>Painel da agenda</small></div><button class="sair" id="bSair" type="button">Sair</button></header>
  <div class="wrap">
    <div class="msg" id="mApp" hidden></div>

    <h2>Pedidos para confirmar <span class="badge" id="nPed" hidden></span></h2>
    <div id="pedidos"></div>

    <h2>Abrir novos horários</h2>
    <div class="card">
      <label for="novaData">Dia</label>
      <input type="date" id="novaData">
      <label>Horários (toque para escolher)</label>
      <div class="chips" id="horas"></div>
      <button class="btn main" type="button" id="bAbrir">Abrir esses horários</button>
    </div>

    <h2>Minha agenda</h2>
    <div class="legenda"><span><i style="background:#BFD9D4"></i>livre</span><span><i style="background:var(--warn)"></i>pedido</span><span><i style="background:var(--ok)"></i>confirmado</span></div>
    <div id="agenda"></div>
    <div class="acoes" id="acoes" hidden></div>
  </div>
</section>

<script src="../config.js"></script>
<script>
(function(){
  var C=window.SUPABASE||{},$=function(i){return document.getElementById(i)};
  var SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  var HORAS=['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
  var escolhidas={'13:00':1,'14:00':1,'15:00':1,'16:00':1,'17:00':1};
  var rows=[],sel=null,sess=null;

  function hh(h){return (+h.slice(0,2))+(h.slice(3)==='00'?'h':'h'+h.slice(3))}
  function parse(d){var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function dd(n){return (n<10?'0':'')+n}
  function dia(d){var x=parse(d);return SEM[x.getDay()]+', '+dd(x.getDate())+'/'+dd(x.getMonth()+1)}
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function say(id,t,ok){var m=$(id);if(!t){m.hidden=true;return}m.textContent=t;m.className='msg'+(ok?' ok':'');m.hidden=false}

  try{sess=JSON.parse(localStorage.getItem('amanda-sess')||'null')}catch(e){}
  function save(s){sess=s;try{s?localStorage.setItem('amanda-sess',JSON.stringify(s)):localStorage.removeItem('amanda-sess')}catch(e){}}

  function auth(path,body){return fetch(C.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:C.anonKey,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})}
  function toSess(j){return {token:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000}}
  function token(){
    if(!sess)return Promise.reject();
    if(Date.now()<sess.exp)return Promise.resolve(sess.token);
    return auth('token?grant_type=refresh_token',{refresh_token:sess.refresh}).then(function(j){save(toSess(j));return sess.token}).catch(function(){save(null);throw 0});
  }
  function api(method,path,body,extra){
    return token().then(function(t){
      var h={apikey:C.anonKey,Authorization:'Bearer '+t,'Content-Type':'application/json'};if(extra)for(var k in extra)h[k]=extra[k];
      return fetch(C.url+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
    }).then(function(r){if(r.status===401){save(null);show();throw 0}if(!r.ok)throw 1;return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null})});
  }

  function show(){
    var on=!!sess&&C.url;
    $('vLogin').hidden=on;$('vApp').hidden=!on;
    if(!C.url){$('vLogin').hidden=false;say('mLogin','O painel ainda não foi ligado ao Supabase. Preencha o arquivo config.js.')}
    if(on)carregar();
  }

  $('fLogin').onsubmit=function(e){e.preventDefault();$('bLogin').disabled=true;say('mLogin','');
    auth('token?grant_type=password',{email:$('email').value.trim(),password:$('senha').value})
      .then(function(j){save(toSess(j));$('senha').value='';show()})
      .catch(function(){say('mLogin','E-mail ou senha incorretos.')})
      .then(function(){$('bLogin').disabled=false})};
  $('bSair').onclick=function(){save(null);rows=[];sel=null;show()};

  function carregar(){
    var hoje=new Date();hoje=hoje.getFullYear()+'-'+dd(hoje.getMonth()+1)+'-'+dd(hoje.getDate());
    api('GET','horarios?select=*&data=gte.'+hoje+'&order=data,hora').then(function(j){rows=j||[];say('mApp','');desenhar()})
      .catch(function(){say('mApp','Não consegui carregar a agenda. Confira a internet e tente de novo.')});
  }

  function desenhar(){
    var ped=rows.filter(function(r){return r.status==='pedido'});
    var n=$('nPed');n.hidden=!ped.length;n.textContent=ped.length;
    $('pedidos').innerHTML=ped.length?ped.map(function(r){return '<div class="card pedido" style="margin-bottom:10px"><b>'+esc(r.nome)+'</b><div class="qd">'+esc(r.servico)+'<br>'+dia(r.data)+' às '+hh(r.hora)+'</div>'+
      '<div class="row"><button class="btn ok" data-a="confirmar" data-id="'+r.id+'" type="button">Confirmar</button><button class="btn bad" data-a="liberar" data-id="'+r.id+'" type="button">Recusar</button></div></div>'}).join(''):'<p class="vazio">Nenhum pedido por enquanto.</p>';

    var por={},ordem=[];rows.forEach(function(r){if(!por[r.data]){por[r.data]=[];ordem.push(r.data)}por[r.data].push(r)});
    $('agenda').innerHTML=ordem.length?ordem.map(function(d){return '<div class="dia"><h3>'+dia(d)+'</h3><div class="chips">'+por[d].map(function(r){
      return '<button class="s '+r.status+'" data-id="'+r.id+'" aria-pressed="'+(sel===r.id)+'" type="button">'+hh(r.hora)+'<small>'+(r.status==='livre'?'livre':esc((r.nome||'').split(' ')[0]||r.status))+'</small></button>'}).join('')+'</div></div>'}).join(''):'<p class="vazio">Nenhum horário aberto. Use “Abrir novos horários” acima.</p>';
    acoes();
  }

  function acoes(){
    var box=$('acoes'),r=rows.filter(function(x){return x.id===sel})[0];
    if(!r){box.hidden=true;return}
    var h='<p>'+dia(r.data)+' às '+hh(r.hora)+'</p>';
    if(r.status==='pedido')h+='<div>'+esc(r.nome)+' · '+esc(r.servico)+'</div><button class="btn ok" data-a="confirmar" data-id="'+r.id+'" type="button">Confirmar</button><button class="btn bad" data-a="liberar" data-id="'+r.id+'" type="button">Recusar e liberar</button>';
    if(r.status==='confirmado')h+='<div>'+esc(r.nome)+' · '+esc(r.servico)+'</div><button class="btn bad" data-a="liberar" data-id="'+r.id+'" type="button">Cancelar e liberar horário</button>';
    if(r.status==='livre')h+='<button class="btn ghost" data-a="ocupar" data-id="'+r.id+'" type="button">Marcar como ocupado (marquei por fora)</button>';
    h+='<button class="btn ghost" data-a="remover" data-id="'+r.id+'" type="button">Remover este horário</button>';
    box.innerHTML=h;box.hidden=false;
  }

  function mudar(id,campos){
    return api('PATCH','horarios?id=eq.'+id,campos,{Prefer:'return=minimal'}).then(carregar).catch(function(e){if(e!==0)say('mApp','Não deu certo. Tente de novo.')});
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('button[data-a],button.s');if(!b)return;
    var id=b.getAttribute('data-id'),a=b.getAttribute('data-a');
    if(!a){sel=(sel===id?null:id);desenhar();return}
    b.disabled=true;
    if(a==='confirmar')mudar(id,{status:'confirmado'});
    if(a==='liberar'){sel=null;mudar(id,{status:'livre',nome:null,servico:null,pedido_em:null})}
    if(a==='ocupar')mudar(id,{status:'confirmado',nome:'Marcado por fora',servico:'Manual'});
    if(a==='remover'){sel=null;api('DELETE','horarios?id=eq.'+id,null,{Prefer:'return=minimal'}).then(carregar).catch(function(e){if(e!==0)say('mApp','Não deu certo. Tente de novo.')})}
  });

  // abrir horários
  $('horas').innerHTML=HORAS.map(function(h){return '<button class="chip" type="button" data-h="'+h+'" aria-pressed="'+(!!escolhidas[h])+'">'+hh(h)+'</button>'}).join('');
  $('horas').onclick=function(e){var b=e.target.closest('.chip');if(!b)return;var h=b.getAttribute('data-h');escolhidas[h]=!escolhidas[h];b.setAttribute('aria-pressed',!!escolhidas[h])};
  var hj=new Date();$('novaData').min=hj.getFullYear()+'-'+dd(hj.getMonth()+1)+'-'+dd(hj.getDate());
  $('bAbrir').onclick=function(){
    var d=$('novaData').value,hs=HORAS.filter(function(h){return escolhidas[h]});
    if(!d){say('mApp','Escolha o dia primeiro.');window.scrollTo(0,0);return}
    if(!hs.length){say('mApp','Escolha pelo menos um horário.');return}
    $('bAbrir').disabled=true;
    api('POST','horarios?on_conflict=data,hora',hs.map(function(h){return {data:d,hora:h}}),{Prefer:'resolution=ignore-duplicates,return=minimal'})
      .then(function(){say('mApp',dia(d)+' aberto com '+hs.length+' horário'+(hs.length>1?'s':'')+'.',true);return carregar()})
      .catch(function(e){if(e!==0)say('mApp','Não deu certo. Tente de novo.')})
      .then(function(){$('bAbrir').disabled=false});
  };

  show();
})();
</script>
</body>
</html>
