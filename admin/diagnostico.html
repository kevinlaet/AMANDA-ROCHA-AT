<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Diagnóstico da agenda</title>
<link rel="icon" href="../img/logo.svg" type="image/svg+xml">
<style>
/* Página de conferência: abre, roda sozinha e mostra o que está certo e o que falta. Não cria nem altera nenhum dado. */
:root{--teal:#0B5F59;--cream:#FFF8F1;--ink:#16302C;--muted:#55706B;--line:#E7D6C6;--ok:#1B8A4B;--bad:#B3392F;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;padding:calc(20px + env(safe-area-inset-top)) 16px 40px}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;color:var(--teal);margin-bottom:4px}
.sub{color:var(--muted);font-size:15px;margin-bottom:18px}
.item{display:grid;grid-template-columns:28px 1fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ic{font-size:20px;font-weight:800;line-height:1.3}
.item.ok .ic{color:var(--ok)}.item.bad{border-color:var(--bad)}.item.bad .ic{color:var(--bad)}.item.esp .ic{color:var(--muted)}
.t{font-weight:700}.d{color:var(--muted);font-size:14px}.item.bad .d{color:var(--bad)}
.fim{margin:16px 0;padding:14px;border-radius:14px;font-weight:700;font-size:17px}
.fim.ok{background:#E6F4EC;color:var(--ok)}.fim.bad{background:#FDECEA;color:var(--bad)}
form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
form p{color:var(--muted);font-size:14px;margin-bottom:8px}
input{width:100%;min-height:50px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);font:inherit;margin-bottom:10px}
button{width:100%;min-height:50px;border-radius:12px;border:0;background:var(--teal);color:#fff;font:inherit;font-weight:700}
button:disabled{opacity:.5}
@font-face{font-family:'Cormorant';src:url(../fonts/cormorant-sub.woff2) format('woff2');font-weight:500 600;font-display:swap}
.credito{font-family:Cormorant,Georgia,'Times New Roman',serif;font-weight:600;font-size:12px;letter-spacing:3px;text-transform:uppercase;text-align:center;opacity:.7;color:var(--muted);margin-top:28px}
.credito:before{content:"";display:block;width:36px;height:1px;background:currentColor;opacity:.5;margin:0 auto 10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Diagnóstico da agenda</h1>
  <p class="sub">Confere se o Supabase foi configurado direito. Não cria nem muda nada.</p>
  <div id="lista"></div>
  <div class="fim" id="fim" hidden></div>
  <form id="f" hidden>
    <p>Para conferir também o acesso da Amanda, entre com o e-mail e a senha dela (a senha não sai deste aparelho).</p>
    <input type="email" id="email" autocomplete="username" placeholder="E-mail da Amanda">
    <input type="password" id="senha" autocomplete="current-password" placeholder="Senha">
    <button type="submit" id="bt">Conferir o acesso da Amanda</button>
  </form>
  <p class="credito">Desenvolvido por Kevin Laet</p>
</main>
<script src="../config.js"></script>
<script>
(function(){
  var C=window.SUPABASE||{},$=function(i){return document.getElementById(i)},lista=$('lista'),falhas=0,itens={};
  function item(id,titulo){var d=document.createElement('div');d.className='item esp';d.innerHTML='<div class="ic">…</div><div><div class="t"></div><div class="d"></div></div>';d.querySelector('.t').textContent=titulo;lista.appendChild(d);itens[id]=d}
  function marca(id,ok,detalhe){var d=itens[id];d.className='item '+(ok?'ok':'bad');d.querySelector('.ic').textContent=ok?'✓':'✗';d.querySelector('.d').textContent=detalhe||'';if(!ok)falhas++}
  function rest(caminho,opcoes,token){
    var h={apikey:C.anonKey,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
    return fetch(C.url+caminho,Object.assign({headers:h},opcoes||{})).then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}return {status:r.status,json:j}})});
  }
  var ZERO='00000000-0000-0000-0000-000000000000';
  item('cfg','Endereço e chave no config.js');
  item('agenda','A agenda pública responde');
  item('pedir','A reserva de horário funciona');
  item('priv1','Visitantes não conseguem ler os horários');
  item('priv2','Visitantes não conseguem ler o histórico nem a lista de admins');
  item('signup','Cadastro aberto está desligado');
  function fim(){var f=$('fim');f.hidden=false;f.className='fim '+(falhas?'bad':'ok');f.textContent=falhas?falhas+' item'+(falhas>1?'ns precisam':' precisa')+' de atenção. Confira o que está com ✗ e me mande uma foto desta tela.':'Tudo certo até aqui.'}
  function publico(){
    if(!C.url||!C.anonKey){marca('cfg',false,'Preencha url e anonKey no arquivo config.js e envie para o GitHub.');return Promise.resolve()}
    if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(C.url)){marca('cfg',false,'O endereço deve ser parecido com https://abcdefgh.supabase.co, sem barra no fim.');return Promise.resolve()}
    if(/service_role|sb_secret_/.test(C.anonKey)){marca('cfg',false,'ATENÇÃO: essa é uma chave secreta. Troque pela chave pública (Publishable key) agora.');return Promise.resolve()}
    marca('cfg',true,C.url);
    return Promise.all([
      rest('/rest/v1/rpc/agenda_publica',{method:'POST',body:'{}'}).then(function(r){
        marca('agenda',r.status===200&&Array.isArray(r.json),r.status===200&&Array.isArray(r.json)?r.json.length+' horário(s) à venda no momento.':r.status===404?'A função agenda_publica não existe. Rode o arquivo schema.sql no SQL Editor.':'Erro '+r.status+'. Confira a chave pública no config.js.')}),
      rest('/rest/v1/rpc/pedir_horario',{method:'POST',body:JSON.stringify({p_id:ZERO,p_servico:'Teste',p_nome:'Teste de conferência',p_telefone:'11900000000'})}).then(function(r){
        marca('pedir',r.status===200&&r.json==='indisponivel',r.status===200&&r.json==='indisponivel'?'Respondeu como esperado (sem reservar nada).':r.status===404?'A função pedir_horario não existe. Rode o arquivo schema.sql.':'Resposta inesperada ('+r.status+').')}),
      rest('/rest/v1/horarios?select=id&limit=1').then(function(r){
        var fechado=r.status===401||r.status===403||(r.status===200&&Array.isArray(r.json)&&r.json.length===0);
        marca('priv1',fechado&&!(r.status===200&&r.json&&r.json.length),fechado?'Os nomes e telefones das clientes estão protegidos.':'PERIGO: visitantes conseguem ler os horários. Rode o schema.sql de novo.')}),
      Promise.all([rest('/rest/v1/historico?select=id&limit=1'),rest('/rest/v1/admins?select=email&limit=1')]).then(function(rs){
        var ok=rs.every(function(r){return r.status===401||r.status===403||(r.status===200&&Array.isArray(r.json)&&!r.json.length)});
        marca('priv2',ok,ok?'Protegidos.':'PERIGO: visitantes conseguem ler. Rode o schema.sql de novo.')}),
      fetch(C.url+'/auth/v1/settings',{headers:{apikey:C.anonKey}}).then(function(r){return r.json()}).then(function(j){
        marca('signup',j.disable_signup===true,j.disable_signup===true?'Só quem você cadastrou consegue entrar.':'Qualquer pessoa pode criar conta. Desligue "Allow new users to sign up" em Authentication > Sign In / Providers.')},
        function(){marca('signup',false,'Não consegui consultar as configurações de login.')})
    ]);
  }
  publico().then(function(){fim();if(C.url&&C.anonKey)$('f').hidden=false});

  $('f').onsubmit=function(e){
    e.preventDefault();$('bt').disabled=true;
    ['login','admin','ler','hora'].forEach(function(k){if(itens[k])itens[k].remove()});
    item('login','Login da Amanda');item('admin','O e-mail dela tem acesso à agenda');item('ler','Ela consegue ler a agenda completa');item('hora','Relógio do banco (Brasília)');
    fetch(C.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:C.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim().toLowerCase(),password:$('senha').value})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
      .then(function(r){
        if(!r.ok){marca('login',false,'E-mail ou senha incorretos, ou o usuário não foi criado em Authentication > Users.');['admin','ler','hora'].forEach(function(k){marca(k,false,'—')});return}
        marca('login',true,'Entrou.');var t=r.j.access_token;
        return Promise.all([
          rest('/rest/v1/rpc/sou_admin',{method:'POST',body:'{}'},t).then(function(x){marca('admin',x.json===true,x.json===true?'Sim.':'Não. O e-mail digitado aqui é diferente do que foi colocado no schema.sql. Para corrigir, rode no SQL Editor: insert into public.admins (email) values (\'e-mail-certo\');')}),
          rest('/rest/v1/horarios?select=id&limit=1',{},t).then(function(x){marca('ler',x.status===200,x.status===200?'Sim.':'Não (erro '+x.status+').')}),
          rest('/rest/v1/rpc/agora_sp',{method:'POST',body:'{}'},t).then(function(x){marca('hora',x.status===200&&/^\d{4}-\d\d-\d\dT/.test(x.json||''),x.status===200?String(x.json).replace('T',' ').slice(0,16):'Erro '+x.status)})
        ]);
      })
      .catch(function(){marca('login',false,'Sem conexão.')})
      .then(function(){fim();$('bt').disabled=false});
  };
})();
</script>
</body>
</html>
